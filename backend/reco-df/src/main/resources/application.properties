# Configurações do banco de dados PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=reco_df
quarkus.datasource.password=reco_df_pass
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/reco_df_db

# Configurações do Hibernate ORM com Panache
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configurações do SmallRye OpenAPI (Swagger UI)
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger-ui

# Chave para assinar tokens
smallrye.jwt.sign.key.location=privatekey_pkcs8.pem

# Chave para verificar tokens (caso tenha endpoints protegidos)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=reco-df-issuer


quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS